services:
  persistent-call-handler:
    build: .
    container_name: persistent-call-handler
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - .env.local
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8001/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
        reservations:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - call-handler-network

networks:
  call-handler-network:
    driver: bridge
